*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:18px 16px;position:sticky;top:0;z-index:5}

button{border:0;border-radius:12px;padding:12px 15px;font-weight:750;cursor:pointer}.primary{background:#111827;color:white}.secondary{background:#e5e7eb;color:#111827}.row{display:flex;gap:8px;flex-wrap:wrap}.result{white-space:pre-wrap;background:#f9fafb;border:1px dashed #d1d5db;border-radius:12px;padding:14px;margin-top:12px;line-height:1.5}
.badge{display:inline-block;background:#eef2ff;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.hidden{display:none}.bar{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden}.fill{height:100%;background:#111827;width:0}.small{font-size:12px}
.install{display:none;margin-top:10px;width:100%}

<script>
const $=id=>document.getElementById(id);
const key='bizboost-profile-v2', usageKey='bizboost-usage-v2', dayKey='bizboost-day-v2';
function today(){return new Date().toISOString().slice(0,10)}
function usage(){if(localStorage.getItem(dayKey)!==today()){localStorage.setItem(dayKey,today());localStorage.setItem(usageKey,'0')}return +(localStorage.getItem(usageKey)||0)}
function updateUsage(){let u=usage();$('usageText').textContent=`${u}/5 free generations used today`;$('usageFill').style.width=Math.min(100,u/5*100)+'%'}
function show(id){document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));$(id).classList.remove('hidden');window.scrollTo(0,0);updateUsage()}
function profile(){return {name:$('bizName').value.trim()||'your business',type:$('bizType').value.trim()||'small business',offer:$('bizOffer').value.trim()||'your products',contact:$('bizContact').value.trim()}}
function saveProfile(){localStorage.setItem(key,JSON.stringify(profile()));alert('Business profile saved.')}
function loadProfile(){let p=JSON.parse(localStorage.getItem(key)||'null');if(!p)return alert('No saved profile yet.');$('bizName').value=p.name;$('bizType').value=p.type;$('bizOffer').value=p.offer;$('bizContact').value=p.contact}
function consume(){let u=usage();if(u>=5){alert('You have used the 5 free generations for today.');return false}localStorage.setItem(usageKey,String(u+1));updateUsage();return true}
function put(id,text){$(id).textContent=text;$(id).classList.remove('hidden');let b=document.createElement('button');b.className='secondary';b.textContent='Copy';b.style.marginTop='8px';b.onclick=()=>navigator.clipboard?.writeText(text);$(id).appendChild(b)}
function generate(type){
 if(!consume())return; let p=profile(), text='';
 if(type==='post'){let d=$('postDetails').value.trim()||'a special offer';text=`${p.name} is here to help you with ${p.offer}.\n\n${d}\n\nReady to order? Message us on ${p.contact||'WhatsApp'}.\n\n#${p.name.replace(/\W/g,'')} #SmallBusiness #ShopLocal`}
 if(type==='flyer'){let d=$('flyerDetails').value.trim()||'Limited-time offer';text=`${$('flyerPromo').value.trim()||'SPECIAL OFFER'}\n\n${p.name}\n${d}\n\nWe offer: ${p.offer}\n\nORDER NOW\n${p.contact||'Contact us today'}\nLimited availability. Terms may apply.`}
 if(type==='reply'){let m=$('customerMsg').value.trim()||'I would like to know more.';text=`Hi! Thanks for reaching out to ${p.name}. 😊\n\nRegarding your message: “${m}”\n\nWe’d be happy to help. Please send us the details you need, and we’ll get back to you as soon as possible.\n\n${p.contact||'Thank you for choosing us!'}`}
 if(type==='ideas'){let g=$('ideaGoal').value;text=`Marketing ideas for ${p.name} (${g}):\n\n1. Post a short product demo or behind-the-scenes clip.\n2. Create a limited-time offer with a clear deadline.\n3. Ask happy customers for a short testimonial.\n4. Share a useful tip related to ${p.offer}.\n5. Run a simple “tag a friend” awareness post.\n6. Create a weekly customer FAQ post.\n7. Offer a small repeat-customer perk.`}
 put(type+'Result',text)
}
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').style.display='block'});
$('install').onclick=async()=>{if(deferred){deferred.prompt();deferred=null}};
loadProfile();updateUsage();
</script>
